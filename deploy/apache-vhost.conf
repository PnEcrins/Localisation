

<VirtualHost *:80>
    ServerName localisation.ecrins-parcnational.fr

    DocumentRoot /var/www/localisation/dist

    <Directory /var/www/localisation/dist>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # config.json n'est pas dans dist/ (retiré du build, voir package.json) :
    # c'est un fichier fourni/édité à la main sur le serveur, en dehors du
    # dossier de build qui peut être régénéré/vidé à chaque déploiement.
    Alias /config.json /var/www/localisation/config.json
    <Files "/var/www/localisation/config.json">
        Require all granted
    </Files>

</VirtualHost>
